<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 文档问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #f2f4f8; color: #1f2937; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  #chunks {
    font-size: 12px; color: #6b7280; background: #eef2ff;
    border-radius: 10px; padding: 2px 10px;
  }
  #agentMode {
    font-size: 12.5px; color: #374151; display: flex; align-items: center; gap: 4px;
    cursor: pointer; user-select: none;
  }
  #agentMode input { accent-color: #3b82f6; }
  .route {
    font-size: 11.5px; color: #4338ca; background: #eef2ff;
    border-radius: 4px; padding: 2px 8px; margin-bottom: 6px;
    display: inline-block; white-space: normal;
  }
  header .spacer { flex: 1; }
  button {
    border: 1px solid #d1d5db; background: #fff; color: #374151;
    border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #f9fafb; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  #list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { max-width: 78%; border-radius: 12px; padding: 10px 14px; line-height: 1.65; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 3px; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 3px; }
  .bot.refused { background: #f9fafb; color: #9ca3af; font-style: italic; border-style: dashed; }
  .rewrite { font-size: 12px; color: #9ca3af; margin-bottom: 6px; white-space: normal; }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cite {
    font-size: 11.5px; color: #4b5563; background: #f3f4f6;
    border-radius: 4px; padding: 2px 8px; white-space: nowrap;
  }
  .pending { align-self: flex-start; color: #9ca3af; font-size: 13px; padding: 4px 2px; }

  footer {
    background: #fff; border-top: 1px solid #e5e7eb; padding: 14px 20px; flex-shrink: 0;
  }
  #bar { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 10px 14px; font-size: 14.5px; outline: none; font-family: inherit;
  }
  #q:focus { border-color: #3b82f6; }
  #send {
    background: #3b82f6; color: #fff; border: none; border-radius: 8px;
    padding: 0 22px; font-size: 14.5px; cursor: pointer;
  }
  #send:disabled { background: #93c5fd; cursor: not-allowed; }
  #err { max-width: 760px; margin: 6px auto 0; color: #dc2626; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>RAG 文档问答</h1>
  <span id="chunks"></span>
  <label id="agentMode" title="走 v0.6 混合路由：聚合题自动分解+整架扫描，较慢但能数全">
    <input type="checkbox" id="agent"> 混合路由
  </label>
  <span class="spacer"></span>
  <button id="ingest" title="重新读取 data/ 文档并热重建索引">重建索引</button>
  <button id="reset">新对话</button>
</header>

<div id="chat"><div id="list"></div></div>

<footer>
  <div id="bar">
    <input id="q" placeholder="问点什么…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <div id="err"></div>
</footer>

<script>
const list = document.getElementById("list");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");
const errBox = document.getElementById("err");

// 会话 id 存 localStorage：刷新页面不丢上下文；点"新对话"才换新 id
let sid = localStorage.getItem("rag_sid");
if (!sid) { sid = crypto.randomUUID(); localStorage.setItem("rag_sid", sid); }

function addMsg(el) { list.appendChild(el); document.getElementById("chat").scrollTop = 1e9; }

function bubbleUser(text) {
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  addMsg(d);
}

function shortName(s) { return s.length > 18 ? s.slice(0, 16) + "…" : s; }

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || r.status);
  return data;
}

// v0.6 混合路由（非流式）: 路由徽章 + 子查询透明化 + 整段回答
async function askAgent(text) {
  const bot = document.createElement("div");
  bot.className = "bot msg";
  const body = document.createElement("div");
  body.className = "pending"; body.textContent = "规划中…（混合路由，聚合题较慢）";
  bot.appendChild(body);
  addMsg(bot);
  const r = await post("/api/agent", { session_id: sid, question: text });
  const badge = document.createElement("div");
  badge.className = "route";
  badge.textContent = r.route === "agg"
    ? `路:agg · 分解 ${r.sub_queries.length} 条 · 候选 ${r.contexts} 块`
    : `路:${r.route}`;
  body.className = ""; body.textContent = r.answer;
  if (r.refused) bot.classList.add("refused");
  bot.insertBefore(badge, body);
}

// SSE 流式问答：meta（改写+引用）先行，delta 逐段追加，done 收尾
async function ask() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  errBox.textContent = "";
  input.value = "";
  bubbleUser(text);
  sendBtn.disabled = true;

  if (document.getElementById("agent").checked) {
    try {
      await askAgent(text);
    } catch (e) {
      errBox.textContent = "请求失败: " + e.message;
    } finally {
      sendBtn.disabled = false; input.focus();
    }
    return;
  }

  const bot = document.createElement("div");
  bot.className = "bot msg";
  const body = document.createElement("div");
  body.className = "pending"; body.textContent = "检索中…";
  addMsg(bot);

  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, question: text }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "", full = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {          // SSE 帧以空行分隔
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", dt = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) ev = line.slice(7);
          else if (line.startsWith("data: ")) dt += line.slice(6);
        }
        if (ev === "meta") {
          const m = JSON.parse(dt);
          if (m.rewrite) {
            const r = document.createElement("div");
            r.className = "rewrite"; r.textContent = "改写 " + m.rewrite;
            bot.appendChild(r);
          }
          body.className = ""; body.textContent = m.refused ? m.answer : "";
          if (m.refused) bot.classList.add("refused");
          bot.appendChild(body);
          if (m.hits && m.hits.length) {
            const cites = document.createElement("div");
            cites.className = "cites";
            m.hits.forEach((h, k) => {
              const c = document.createElement("span");
              c.className = "cite";
              c.textContent = `[${k + 1}] ${shortName(h.source)} 第${h.chunk_index + 1}块 · ${h.score}`;
              cites.appendChild(c);
            });
            bot.appendChild(cites);
          }
        } else if (ev === "delta") {
          full += JSON.parse(dt).text;
          body.textContent = full;
          document.getElementById("chat").scrollTop = 1e9;
        } else if (ev === "error") {
          throw new Error(JSON.parse(dt).message);
        }
      }
    }
  } catch (e) {
    if (!body.textContent || body.textContent === "检索中…") body.textContent = "";
    body.className = ""; body.textContent += "（出错了）";
    errBox.textContent = "请求失败: " + e.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = ask;
input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

document.getElementById("reset").onclick = () => {
  sid = crypto.randomUUID();
  localStorage.setItem("rag_sid", sid);
  list.innerHTML = "";
  post("/api/reset", { session_id: sid }).catch(() => {});
};

document.getElementById("ingest").onclick = async (e) => {
  const btn = e.target;
  if (!confirm("重新读取 data/ 全部文档并重建索引？")) return;
  btn.disabled = true; btn.textContent = "重建中…";
  try {
    const r = await post("/api/ingest");
    document.getElementById("chunks").textContent = `库内 ${r.total} 块`;
    errBox.textContent = "";
  } catch (err) {
    errBox.textContent = "重建失败: " + err.message;
  } finally {
    btn.disabled = false; btn.textContent = "重建索引";
  }
};

(async () => {  // 启动时拉取库规模
  try {
    const r = await fetch("/api/health").then(x => x.json());
    document.getElementById("chunks").textContent = `库内 ${r.chunks} 块`;
  } catch {}
  input.focus();
})();
</script>
</body>
</html>
